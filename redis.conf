# Redis Cluster 基础配置。节点专属端口和 announce hostname 由 Compose 注入。
port 6379
bind 0.0.0.0
protected-mode no
daemonize no

# 集群必须开启 cluster bus；Redis 会使用 port + 10000，即 16379。
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage yes

# 与单节点 Redis 保持一致的认证和持久化策略。
requirepass 123456
masterauth 123456
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
save 900 1
save 300 10
save 60 10000

dir /data
loglevel notice
logfile ""
timeout 300
databases 16
maxmemory 4gb
maxmemory-policy allkeys-lru
slowlog-log-slower-than 5000
slowlog-max-len 1000
maxclients 10000